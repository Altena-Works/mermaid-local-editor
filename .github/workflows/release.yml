name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3). Falls back to package.json."
        required: false

# 既定は読み取りのみ。書き込みが要る release ジョブだけに job 単位で付与する。
permissions:
  contents: read

jobs:
  # ---- バージョン解決（各ジョブで共有）----
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: ver
        # 信頼できない入力は env 経由で受け、shell へ直接展開しない
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          elif [ "$REF_TYPE" = tag ] && printf '%s' "$REF_NAME" | grep -qE '^v[0-9]'; then v="${REF_NAME#v}"
          else v="$(node -p "require('./package.json').version")"; fi
          # 後続ジョブで式展開されるため、安全な文字種へ正規化する
          v=$(printf '%s' "$v" | tr -cd '0-9A-Za-z.+_-')
          [ -n "$v" ] || v="0.0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version = $v"

  # ---- 各OSでビルド → artifact 化（ここでは publish しない）----
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            key: mac
            target: universal-apple-darwin
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            key: win-x64
            target: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: windows-latest
            key: win-arm64
            target: aarch64-pc-windows-msvc
            artifacts: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            key: linux
            target: x86_64-unknown-linux-gnu
            artifacts: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps (Tauri build requirements)
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci

      # tauri.conf.json は package.json の version を参照するので、ここが
      # インストーラの表示バージョンになる。Cargo.toml だけは参照できないため
      # 同じ値で書き換える。Cargo.lock は次のビルドで cargo が更新する。
      - name: Set version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node scripts/set-crate-version.mjs "$VERSION"
        shell: bash

      - run: npm run build:renderer

      - name: Package (${{ matrix.key }})
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.key }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # ---- 成果物を集約して GitHub Release を作成（tag push 時のみ）----
  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: List
        run: find dist -type f | sort

      # 本文 = CHANGELOG の該当版節（日英併記）+ ダウンロード表。CHANGELOG が唯一のソース。
      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Mermaid Local Editor ${REF_NAME}"
            # 本文へ載せるのは各言語ブロックの要約と、利用者向けの 変更 / 修正 節だけ。
            # 追加・削除・検証・備考は開発側の記録なので CHANGELOG に留める。
            # 節を飛ばしている間は空行・字下げ行・箇条書きを捨て、最初の通常行
            # （次の言語ブロックの要約）で復帰する。
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
              grab && /^## \[/ { exit }
              grab {
                if ($0 ~ /^### /) {
                  if ($0 ~ /^### (変更|修正|Changed|Fixed)[[:space:]]*$/) { skip = 0; print; next }
                  skip = 1
                  next
                }
                if (skip) {
                  if ($0 ~ /^$/ || $0 ~ /^[[:space:]]/ || $0 ~ /^-/) next
                  skip = 0
                }
                print
              }
            ' CHANGELOG.md
            echo
            cat .github/release-assets.md
          } > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/**/*
          generate_release_notes: false
          body_path: release-notes.md
