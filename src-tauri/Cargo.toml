[package]
name = "mermaid-local-editor"
version = "0.5.1"
description = "A local, cross-platform Mermaid diagram editor"
authors = ["4ltena"]
edition = "2021"

[lib]
name = "mermaid_local_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.17", features = ["common-controls-v6"] }
base64 = "0.22"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
